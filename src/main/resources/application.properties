spring.application.name=banking-core-api
server.port=8081
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false
tiwalo.transfer.max-amount-minor=${TIWALO_TRANSFER_CAP_MINOR}
spring.jackson.deserialization.fail-on-reading-dup-tree-key=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.datasource.url=jdbc:postgresql://localhost:${TIWALO_POSTGRES_PORT:5433}/banking_core
