services:
  postgres:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    ports:
      - "127.0.0.1:${TIWALO_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: banking_core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local PostgreSQL bootstrap password}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set the local application database user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set the local application database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dev/postgres/application-role.sql:/docker-entrypoint-initdb.d/10-application-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$SPRING_DATASOURCE_USERNAME\" -d banking_core"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:${TIWALO_KEYCLOAK_PORT:-8180}:8080"
    environment:
      KC_HOSTNAME: http://localhost:${TIWALO_KEYCLOAK_PORT:-8180}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./dev/keycloak/tiwalo-realm.json:/opt/keycloak/data/import/tiwalo-realm.json:ro

volumes:
  postgres-data:
  keycloak-data:
